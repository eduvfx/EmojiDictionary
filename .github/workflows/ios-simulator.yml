name: iOS Simulator

# Compila o projecto, arranca a app num simulador de iPhone, tira um screenshot
# e corre os testes unitários — tudo num runner macOS gratuito do GitHub.
# Resultado: artefacto "ios-simulator" com as imagens e o log dos testes.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versões (Xcode / simuladores)
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -5

      - name: Escolher simulador e arrancá-lo
        id: sim
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available | sed -nE 's/^ *iPhone [^(]*\(([0-9A-Fa-f-]{36})\) \(Shutdown\).*/\1/p' | head -1)
          if [ -z "$NAME" ]; then NAME=$(xcrun simctl list devices available | grep -m1 -oE '[0-9A-Fa-f-]{36}'); fi
          echo "udid=$NAME" >> "$GITHUB_OUTPUT"
          echo "simulador: $NAME"
          xcrun simctl boot "$NAME" || true
          xcrun simctl bootstatus "$NAME" -b

      - name: Compilar (build)
        run: |
          set -o pipefail
          xcodebuild build \
            -project EmojiDictionary.xcodeproj \
            -scheme EmojiDictionary \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -40

      - name: Instalar, arrancar e tirar screenshot
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find build/Build/Products -maxdepth 3 -name "EmojiDictionary.app" | head -1)
          echo "app: $APP"
          mkdir -p artifacts
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.example.EmojiDictionary
          sleep 8
          xcrun simctl io "$UDID" screenshot artifacts/01-lista.png
          ls -la artifacts

      - name: Testes (unitários + interface) no simulador, com vídeo
        run: |
          set -o pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force artifacts/app-em-uso.mp4 &
          REC=$!
          set +e
          xcodebuild test \
            -project EmojiDictionary.xcodeproj \
            -scheme EmojiDictionary \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath artifacts/testes.xcresult | tail -80
          RC=$?
          set -e
          kill -INT $REC 2>/dev/null || true
          sleep 5
          ls -la artifacts
          echo "xcodebuild test rc=$RC"
          exit $RC

      - name: Extrair screenshots dos testes
        if: always()
        run: |
          mkdir -p artifacts/screenshots
          xcrun xcresulttool export attachments --path artifacts/testes.xcresult --output-path artifacts/screenshots 2>&1 | tail -5 || \
          echo "(xcresulttool export não disponível nesta versão do Xcode — as imagens ficam dentro de testes.xcresult)"
          ls -la artifacts/screenshots | head -20

      - name: Compilar app universal limpa e empacotar para o Appetize.io
        if: always()
        run: |
          set -uo pipefail
          mkdir -p artifacts
          # App limpa (sem plugins de teste) e universal (arm64 + x86_64) para
          # correr em qualquer infraestrutura do Appetize.io.
          xcodebuild build \
            -project EmojiDictionary.xcodeproj \
            -scheme EmojiDictionary \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build-app \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO | tail -15 || true
          APP=$(find build-app/Build/Products -maxdepth 3 -name "EmojiDictionary.app" | head -1)
          if [ -z "$APP" ]; then
            echo "build universal falhou — uso o .app do build de testes"
            APP=$(find build/Build/Products -maxdepth 3 -name "EmojiDictionary.app" | head -1)
          fi
          if [ -n "$APP" ]; then
            echo "app: $APP"
            lipo -info "$APP/EmojiDictionary" || true
            ditto -c -k --keepParent "$APP" artifacts/EmojiDictionary-app.zip
            ls -la artifacts/EmojiDictionary-app.zip
          else
            echo "não encontrei nenhum .app"
          fi

      - name: Screenshot final (depois dos testes)
        if: always()
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl launch "$UDID" com.example.EmojiDictionary || true
          sleep 6
          xcrun simctl io "$UDID" screenshot artifacts/02-lista-depois-dos-testes.png || true

      - name: Publicar no Appetize.io (ecrã interactivo no browser)
        if: always() && env.APPETIZE_API_TOKEN != ''
        run: |
          set -uo pipefail
          ZIP=$(ls artifacts/EmojiDictionary-app.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then echo "sem EmojiDictionary-app.zip, nada a publicar"; exit 0; fi
          RESP=$(curl -s --http1.1 --max-time 300 "https://api.appetize.io/v2/apps" \
                    -H "Authorization: Bearer $APPETIZE_API_TOKEN" \
                    -F "file=@$ZIP" -F "platform=ios" || true)
          echo "resposta do Appetize: $(echo "$RESP" | head -c 300)"
          KEY=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('publicKey',''))" 2>/dev/null || true)
          if [ -n "$KEY" ]; then
            echo "### Ecrã interactivo: https://appetize.io/app/$KEY" >> "$GITHUB_STEP_SUMMARY"
            echo "LINK INTERACTIVO: https://appetize.io/app/$KEY"
          else
            echo "não recebi publicKey do Appetize (ver a resposta acima)"; exit 0
          fi

      - name: Publicar artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            artifacts/
            build/Logs/Test
          if-no-files-found: warn
